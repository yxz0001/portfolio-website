<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yu Xiao Zhu | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="main-header" id="main-header">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>
</header>

<main>

<section id="contact-me" class="contact-me card">
    <h1>Let’s work together</h1>
    <p style="color:#94a3b8">Fill out the form below.</p>

    <form onsubmit="return validateForm()">

        <label for="firstName">First Name</label>
        <input type="text" id="firstName">

        <label for="email">Email</label>
        <input type="email" id="email">

        <label for="confirmEmail">Confirm Email</label>
        <input type="email" id="confirmEmail">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone">

        <label for="description">Project Description</label>
        <input type="text" id="description">

        <label for="date">Project Date</label>
        <input type="date" id="date">

        <label for="duration">Duration (weeks)</label>
        <input type="number" id="duration">

        <p>Preferred Contact Method:</p>
        <input type="radio" name="contact"> Email
        <input type="radio" name="contact"> Phone

        <input type="submit" id="submit" class="submit" value="Send Enquiry">
    </form>
</section>

</main>



<script src="script.js"></script>
</body>
</html>
